name: Build debug APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master, dev, music-app ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install SDK platform 37
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0" || sdkmanager "platforms;android-37"

      - name: Local properties (no secrets needed for a debug build)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "" >> gradle.properties
          echo "isFullBuild=true" >> gradle.properties

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions --stacktrace

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace 2>&1 | tee build-log.txt

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: androidApp/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
