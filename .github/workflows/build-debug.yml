name: Build debug APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master, dev, music-app ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Install SDK platform 37
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM --list 2>/dev/null | grep -E "platforms;android-3[5-9]" || true
          PKG=$($SDKM --list 2>/dev/null | grep -oE "platforms;android-37[0-9.]*" | sort -u | head -1)
          echo "Installing $PKG"
          $SDKM "$PKG" "build-tools;37.0.0" || $SDKM "$PKG"

      - name: Local properties (no secrets needed for a debug build)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "" >> gradle.properties
          echo "isFullBuild=true" >> gradle.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Generate aboutLibraries.json
        run: set -o pipefail; ./gradlew exportLibraryDefinitions --stacktrace 2>&1 | tee build-log.txt

      - name: Build debug APK
        run: set -o pipefail; ./gradlew :androidApp:assembleDebug -PonlyArm64 --stacktrace 2>&1 | tee -a build-log.txt

      - name: Publish APK as a release download
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls androidApp/build/outputs/apk/debug/*arm64*.apk androidApp/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          cp "$APK" SimpMusic-erhu-debug-arm64.apk
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug SimpMusic-erhu-debug-arm64.apk --prerelease \
            --title "Latest debug build" --notes "Built from ${{ github.sha }}. Download the .apk directly and install."

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: androidApp/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
